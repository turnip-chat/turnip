<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnip - スレッド</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
}

button {
    cursor: pointer;
}

#topBar {
    height: 55px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 10px;
}

#backButton {
    padding: 8px 14px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
}

#title {
    margin: 0;
    font-size: 20px;
}

#main {
    display: flex;
    height: calc(100vh - 55px);
}

#chatArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

#threadInfo {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 10px 15px;
}

#status {
    color: #666;
    font-size: 13px;
}

#systemSetting {
    font-size: 13px;
    margin-top: 5px;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column-reverse;
}

.message {
    padding: 9px;
    margin: 5px 0;
    border-radius: 8px;
    max-width: 90%;
    word-break: break-word;
}

.myMessage {
    background: #d0ebff;
    align-self: flex-end;
}

.otherMessage {
    background: #ffffff;
    align-self: flex-start;
}

.systemMessage {
    background: #ffeeba;
    align-self: center;
    width: 90%;
}

.messageHeader {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
}

.messageName {
    font-weight: bold;
}

.messageTime {
    color: #777;
    font-size: 11px;
}

.messageButtons {
    display: flex;
    gap: 4px;
}

.messageButtons button {
    padding: 3px 7px;
    font-size: 11px;
}

.messageBody {
    margin-top: 5px;
}

.messageImage {
    max-width: 300px;
    max-height: 300px;
    display: block;
    margin-top: 6px;
    border-radius: 6px;
}

.youtubeFrame {
    width: 300px;
    height: 170px;
    border: none;
    margin-top: 6px;
}

#replyBox {
    display: none;
    background: #e9ecef;
    padding: 8px 12px;
    border-top: 1px solid #ccc;
}

#replyText {
    display: inline-block;
    max-width: calc(100% - 40px);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

#cancelReply {
    float: right;
}

#inputArea {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: white;
    border-top: 1px solid #ddd;
}

#msg {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

#sendButton {
    padding: 10px 18px;
    border: none;
    border-radius: 7px;
    background: #222;
    color: white;
}

#onlineArea {
    width: 240px;
    background: white;
    border-left: 1px solid #ddd;
    padding: 15px;
    overflow-y: auto;
}

#onlineTitle {
    font-weight: bold;
    margin-bottom: 10px;
}

.onlineUser {
    padding: 7px;
    border-bottom: 1px solid #eee;
    font-size: 13px;
}

@media (max-width: 700px) {

    #onlineArea {
        display: none;
    }

    .messageImage {
        max-width: 100%;
    }

    .youtubeFrame {
        max-width: 100%;
    }
}

</style>
</head>

<body>

<div id="topBar">

    <button id="backButton" onclick="goBack()">
        ← スレ一覧
    </button>

    <h2 id="title">
        読み込み中...
    </h2>

</div>


<div id="main">

    <div id="chatArea">

        <div id="threadInfo">

            <div id="status">
                ログイン確認中...
            </div>

            <label id="systemSetting">
                <input
                    type="checkbox"
                    id="toggleSystemMsg"
                >
                システムメッセージ表示
            </label>

        </div>


        <div id="chat"></div>


        <div id="replyBox">

            <span id="replyText"></span>

            <button
                id="cancelReply"
                onclick="cancelReply()"
            >
                ×
            </button>

        </div>


        <div id="inputArea">

            <input
                id="msg"
                type="text"
                placeholder="メッセージを入力..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                onclick="send()"
            >
                送信
            </button>

        </div>

    </div>


    <div id="onlineArea">

        <div id="onlineTitle">
            オンライン
            (<span id="onlineCount">0</span>人)
        </div>

        <div id="onlineUsers"></div>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

/* =========================================
   ★ Turnip Firebase設定
   index.html と完全に同じ
   ========================================= */

const firebaseConfig = {
    apiKey: "AIzaSyDHLzaNUhtOt4Dztz7bTNclO_FY_Mbwb3g",
    authDomain: "turnip-1abf0.firebaseapp.com",
    databaseURL: "https://turnip-1abf0-default-rtdb.firebaseio.com",
    projectId: "turnip-1abf0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


/* =========================================
   基本変数
   ========================================= */

const params = new URLSearchParams(location.search);

const threadId = params.get("id");

let currentUser = null;
let currentName = "";
let fixedID = "";
let replyTo = null;
let isAdmin = false;
let initialized = false;


/* =========================================
   スレッドID確認
   ========================================= */

if (!threadId) {

    alert("スレッドIDがありません");

    window.location.replace("threads.html");

}


/* =========================================
   戻る
   ========================================= */

function goBack() {

    window.location.replace("threads.html");

}


/* =========================================
   システムメッセージ設定
   ========================================= */

let showSystemMsg =
    localStorage.getItem("showSystemMsg") !== "false";

const toggle =
    document.getElementById("toggleSystemMsg");

toggle.checked = showSystemMsg;


toggle.addEventListener("change", function() {

    showSystemMsg = this.checked;

    localStorage.setItem(
        "showSystemMsg",
        showSystemMsg
    );

    document
        .querySelectorAll(".systemMessage")
        .forEach(element => {

            element.style.display =
                showSystemMsg ? "block" : "none";

        });

});


/* =========================================
   ランダムID
   ========================================= */

function generateRandomID(length = 8) {

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    let result = "";

    for (let i = 0; i < length; i++) {

        result += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );

    }

    return result;
}


/* =========================================
   URL判定
   ========================================= */

function isImageURL(text) {

    return /^https?:\/\/.*\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i
        .test(text);

}


function getYouTubeEmbedURL(url) {

    let match;

    match = url.match(
        /youtube\.com\/watch\?v=([^&]+)/i
    );

    if (match) {
        return "https://www.youtube.com/embed/" + match[1];
    }

    match = url.match(
        /youtu\.be\/([^?&]+)/i
    );

    if (match) {
        return "https://www.youtube.com/embed/" + match[1];
    }

    return null;

}


/* =========================================
   ログイン状態
   ========================================= */

auth.onAuthStateChanged(async function(user) {

    /*
     * ここで別Firebaseプロジェクトを使わないことが
     * 今回のページ往復対策の重要ポイント
     */

    if (!user) {

        currentUser = null;

        window.location.replace("index.html");

        return;

    }


    currentUser = user;


    try {

        /* 管理者確認 */

        const adminSnapshot = await db
            .ref("admins/" + user.uid)
            .once("value");

        isAdmin = adminSnapshot.exists();


        /* ユーザー情報 */

        const userRef =
            db.ref("users/" + user.uid);

        const userSnapshot =
            await userRef.once("value");

        const data =
            userSnapshot.val() || {};


        currentName =
            data.displayName ||
            user.displayName ||
            user.email ||
            "名無し";


        fixedID =
            data.fixedID ||
            generateRandomID(8);


        await userRef.update({

            displayName: currentName,
            fixedID: fixedID

        });


        localStorage.setItem(
            "displayName",
            currentName
        );


        document.getElementById("status").innerText =
            currentName + " [" + fixedID + "]";


        /* スレッド存在確認 */

        const threadSnapshot =
            await db.ref(
                "threads/" + threadId
            ).once("value");


        if (!threadSnapshot.exists()) {

            alert("このスレッドは存在しません");

            window.location.replace(
                "threads.html"
            );

            return;

        }


        const threadData =
            threadSnapshot.val();


        document.getElementById("title")
            .innerText =
            threadData.title || "無題のスレッド";


        /* オンライン登録 */

        setupOnline();


        /* 入室メッセージ */

        await db
            .ref(
                "threads/" +
                threadId +
                "/messages"
            )
            .push({

                uid: "system",

                name: "システム",

                message:
                    currentName +
                    " が入室しました",

                time:
                    new Date().toLocaleString("ja-JP")

            });


        initialized = true;


    } catch (error) {

        console.error(error);

        document.getElementById("status")
            .innerText =
            "読み込みエラー: " + error.message;

    }

});


/* =========================================
   オンライン
   ========================================= */

function setupOnline() {

    const onlineRef =
        db.ref(
            "threads/" +
            threadId +
            "/online/" +
            currentUser.uid
        );

    const connectedRef =
        db.ref(".info/connected");


    connectedRef.on("value", function(snapshot) {

        if (snapshot.val() !== true) {
            return;
        }


        onlineRef.onDisconnect().remove();


        onlineRef.set({

            name: currentName,

            id: fixedID

        });

    });

}


/* =========================================
   返信
   ========================================= */

function setReply(msg) {

    replyTo = msg;

    document.getElementById("replyBox")
        .style.display = "block";


    document.getElementById("replyText")
        .innerText =
        "↪ " +
        msg.name +
        ": " +
        msg.message;

}


function cancelReply() {

    replyTo = null;

    document.getElementById("replyBox")
        .style.display = "none";

}


/* =========================================
   メッセージ送信
   ========================================= */

function send() {

    if (!currentUser) {
        alert("ログインしてください");
        return;
    }


    const input =
        document.getElementById("msg");

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    const messageData = {

        uid: currentUser.uid,

        name:
            currentName +
            " [" +
            fixedID +
            "]",

        message: text,

        time:
            new Date().toLocaleString("ja-JP"),

        reply:
            replyTo
                ? {
                    name: replyTo.name,
                    message: replyTo.message
                }
                : null

    };


    db.ref(
        "threads/" +
        threadId +
        "/messages"
    )
    .push(messageData)
    .then(() => {

        input.value = "";

        cancelReply();

    })
    .catch(error => {

        console.error(error);

        alert(
            "送信に失敗しました: " +
            error.message
        );

    });

}


/* =========================================
   Enterで送信
   ========================================= */

document.getElementById("msg")
    .addEventListener("keydown", function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            send();

        }

    });


/* =========================================
   メッセージ表示
   ========================================= */

db.ref(
    "threads/" +
    threadId +
    "/messages"
)
.on("child_added", function(snapshot) {

    const msg =
        snapshot.val();

    const key =
        snapshot.key;


    const div =
        document.createElement("div");

    div.className = "message";


    /* 自分 */

    if (
        currentUser &&
        msg.uid === currentUser.uid
    ) {

        div.classList.add("myMessage");

    }

    /* システム */

    else if (msg.uid === "system") {

        div.classList.add("systemMessage");

        if (!showSystemMsg) {

            div.style.display = "none";

        }

    }

    /* 他人 */

    else {

        div.classList.add("otherMessage");

    }


    /* ヘッダー */

    const header =
        document.createElement("div");

    header.className =
        "messageHeader";


    const info =
        document.createElement("div");


    const name =
        document.createElement("span");

    name.className =
        "messageName";

    name.innerText =
        msg.name || "名無し";


    const time =
        document.createElement("span");

    time.className =
        "messageTime";

    time.innerText =
        " [" +
        (msg.time || "") +
        "]";


    info.appendChild(name);

    info.appendChild(time);


    header.appendChild(info);


    /* ボタン */

    const btnArea =
        document.createElement("div");

    btnArea.className =
        "messageButtons";


    /* 返信 */

    if (msg.uid !== "system") {

        const replyButton =
            document.createElement("button");

        replyButton.innerText =
            "返信";

        replyButton.onclick =
            function() {

                setReply(msg);

            };


        btnArea.appendChild(
            replyButton
        );

    }


    /* 削除 */

    if (
        msg.uid !== "system" &&
        currentUser &&
        (
            msg.uid === currentUser.uid ||
            isAdmin
        )
    ) {

        const deleteButton =
            document.createElement("button");

        deleteButton.innerText =
            "削除";


        deleteButton.onclick =
            function() {

                if (
                    !confirm(
                        "このメッセージを削除しますか？"
                    )
                ) {

                    return;

                }


                db.ref(
                    "threads/" +
                    threadId +
                    "/messages/" +
                    key
                )
                .remove();

            };


        btnArea.appendChild(
            deleteButton
        );

    }


    header.appendChild(
        btnArea
    );


    /* 本文 */

    const body =
        document.createElement("div");

    body.className =
        "messageBody";


    /* 返信表示 */

    if (msg.reply) {

        const reply =
            document.createElement("div");

        reply.style.background =
            "#ddd";

        reply.style.padding =
            "5px";

        reply.style.marginBottom =
            "5px";

        reply.style.fontSize =
            "12px";

        reply.innerText =
            "↪ " +
            msg.reply.name +
            ": " +
            msg.reply.message;


        body.appendChild(reply);

    }


    /* 本文を安全に表示 */

    const parts =
        String(msg.message || "")
            .split(/\s+/);


    parts.forEach(function(part) {

        if (!part) {
            return;
        }


        /* 画像 */

        if (isImageURL(part)) {

            const img =
                document.createElement("img");

            img.src = part;

            img.className =
                "messageImage";

            img.alt = "画像";


            body.appendChild(img);

        }


        /* YouTube */

        else {

            const youtubeURL =
                getYouTubeEmbedURL(part);


            if (youtubeURL) {

                const iframe =
                    document.createElement("iframe");

                iframe.src =
                    youtubeURL;

                iframe.className =
                    "youtubeFrame";

                iframe.allowFullscreen =
                    true;


                body.appendChild(
                    iframe
                );

            }


            else {

                const span =
                    document.createElement("span");

                span.innerText =
                    part + " ";


                body.appendChild(
                    span
                );

            }

        }

    });


    div.appendChild(header);

    div.appendChild(body);


    /*
     * 削除されたら画面からも消す
     */

    db.ref(
        "threads/" +
        threadId +
        "/messages/" +
        key
    )
    .on("value", function(snap) {

        if (!snap.exists()) {

            div.remove();

        }

    });


    document
        .getElementById("chat")
        .prepend(div);

});


/* =========================================
   オンラインユーザー表示
   ========================================= */

const onlineDiv =
    document.getElementById("onlineUsers");

const onlineCount =
    document.getElementById("onlineCount");


db.ref(
    "threads/" +
    threadId +
    "/online"
)
.on("value", function(snapshot) {

    onlineDiv.innerHTML = "";

    let count = 0;


    snapshot.forEach(function(child) {

        const user =
            child.val();

        count++;


        const div =
            document.createElement("div");

        div.className =
            "onlineUser";

        div.innerText =
            (user.name || "名無し") +
            " [" +
            (user.id || "") +
            "]";


        onlineDiv.appendChild(div);

    });


    onlineCount.innerText =
        count;

});

</script>

</body>
</html>
</script>

</body>
</html>
