<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnip - スレッド一覧</title>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
}

button {
    padding: 8px 14px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
    cursor: pointer;
}

#logoutButton {
    position: fixed;
    right: 10px;
    top: 10px;
    background: #222;
    color: white;
}

#status {
    margin: 15px 0;
    color: #666;
}

#panels {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
}

.panel {
    flex: 1;
    padding: 15px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.panel button {
    background: #222;
    color: white;
}

#columns {
    display: flex;
    gap: 20px;
}

.column {
    flex: 1;
    padding: 15px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 10px;
}

.thread {
    padding: 12px 5px;
    border-top: 1px solid #ddd;
}

.thread:first-child {
    border-top: 0;
}

.threadTitle {
    font-size: 18px;
    font-weight: bold;
}

.threadOwner {
    font-size: 13px;
    color: #777;
    margin: 5px 0;
}

@media(max-width:700px) {

    #panels,
    #columns {
        flex-direction: column;
    }

}

</style>
</head>

<body>

<h2>Turnip スレッド一覧</h2>

<button id="logoutButton" onclick="logout()">
ログアウト
</button>

<div id="status">
認証確認中...
</div>


<div id="panels">

    <div class="panel">

        <h3>スレッド作成</h3>

        <input
            id="titleInput"
            placeholder="タイトル"
        >

        <button onclick="createThread()">
            作成
        </button>

    </div>


    <div class="panel">

        <h3>コードで参加</h3>

        <input
            id="inviteInput"
            placeholder="招待コード"
        >

        <button onclick="joinByCode()">
            参加
        </button>

    </div>

</div>


<div id="columns">

    <div class="column">

        <h3>参加中のスレッド</h3>

        <div id="joinedThreads">
            読み込み中...
        </div>

    </div>


    <div class="column">

        <h3>未参加のスレッド</h3>

        <div id="otherThreads">
            読み込み中...
        </div>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDHLzaNUhtOt4Dztz7bTNclO_FY_Mbwb3g",
    authDomain: "turnip-1abf0.firebaseapp.com",
    databaseURL: "https://turnip-1abf0-default-rtdb.firebaseio.com",
    projectId: "turnip-1abf0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;


/* =================================
   LOCAL永続化
================================= */

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
)
.then(() => {

    auth.onAuthStateChanged(async user => {

        console.log(
            "THREADS AUTH:",
            user
        );


        currentUser = user;


        /* =================================
           ★ ここでは即indexに飛ばさない
           ================================= */

        if (!user) {

            document.getElementById(
                "status"
            ).innerText =
                "現在ログインされていません。index.htmlからログインしてください。";


            document.getElementById(
                "joinedThreads"
            ).innerHTML =
                "<p>ログインが必要です。</p>";


            document.getElementById(
                "otherThreads"
            ).innerHTML = "";


            return;
        }


        /* ログイン済み */

        try {

            const snapshot =
                await db.ref(
                    "users/" +
                    user.uid
                ).once("value");


            const data =
                snapshot.val() || {};


            const name =
                data.displayName ||
                user.displayName ||
                user.email ||
                "名無し";


            localStorage.setItem(
                "displayName",
                name
            );


            document.getElementById(
                "status"
            ).innerText =
                name +
                " でログイン中";


            loadThreads();


        } catch (error) {

            console.error(error);

            document.getElementById(
                "status"
            ).innerText =
                "エラー: " +
                error.message;

        }

    });

})
.catch(error => {

    console.error(error);

    document.getElementById(
        "status"
    ).innerText =
        "Firebase認証エラー: " +
        error.message;

});


/* =================================
   スレッド読み込み
================================= */

function loadThreads() {

    db.ref("threads").on(
        "value",
        snapshot => {

            const joined =
                document.getElementById(
                    "joinedThreads"
                );

            const other =
                document.getElementById(
                    "otherThreads"
                );


            joined.innerHTML = "";
            other.innerHTML = "";


            let joinedCount = 0;
            let otherCount = 0;


            snapshot.forEach(
                threadSnapshot => {

                    const data =
                        threadSnapshot.val();

                    const id =
                        threadSnapshot.key;


                    if (
                        !data ||
                        !data.title
                    ) {
                        return;
                    }


                    const isMember =
                        data.members &&
                        data.members[
                            currentUser.uid
                        ] === true;


                    const div =
                        document.createElement(
                            "div"
                        );

                    div.className =
                        "thread";


                    const title =
                        document.createElement(
                            "div"
                        );

                    title.className =
                        "threadTitle";

                    title.innerText =
                        data.title;


                    const owner =
                        document.createElement(
                            "div"
                        );

                    owner.className =
                        "threadOwner";

                    owner.innerText =
                        "作成者: " +
                        (
                            data.ownerName ||
                            "名無し"
                        );


                    div.appendChild(title);
                    div.appendChild(owner);


                    const button =
                        document.createElement(
                            "button"
                        );


                    if (isMember) {

                        button.innerText =
                            "入る";


                        button.onclick =
                            () => {

                                window.location.href =
                                    "thread.html?id=" +
                                    encodeURIComponent(id);

                            };


                        div.appendChild(button);

                        joined.appendChild(div);

                        joinedCount++;

                    } else {

                        button.innerText =
                            "コードが必要";

                        button.disabled =
                            true;


                        div.appendChild(button);

                        other.appendChild(div);

                        otherCount++;

                    }

                }
            );


            if (joinedCount === 0) {

                joined.innerHTML =
                    "<p>参加中のスレッドはありません。</p>";

            }


            if (otherCount === 0) {

                other.innerHTML =
                    "<p>未参加のスレッドはありません。</p>";

            }

        }
    );

}


/* =================================
   ログアウト
================================= */

function logout() {

    if (!confirm("ログアウトしますか？")) {
        return;
    }


    auth.signOut()
        .then(() => {

            localStorage.removeItem(
                "displayName"
            );


            window.location.replace(
                "index.html"
            );

        })
        .catch(error => {

            alert(
                "ログアウト失敗: " +
                error.message
            );

        });

}


/* =================================
   スレッド作成
================================= */

async function createThread() {

    if (!currentUser) {

        alert("ログインしてください");

        return;
    }


    const title =
        document.getElementById(
            "titleInput"
        ).value.trim();


    if (!title) {

        alert("タイトルを入力してください");

        return;
    }


    try {

        const name =
            localStorage.getItem(
                "displayName"
            ) ||
            currentUser.displayName ||
            "名無し";


        const inviteCode =
            generateInviteCode();


        const ref =
            db.ref("threads").push();


        await ref.set({

            title: title,

            owner: currentUser.uid,

            ownerName: name,

            createdAt:
                firebase.database.ServerValue.TIMESTAMP,

            inviteCode: inviteCode,

            members: {

                [currentUser.uid]: true

            }

        });


        await db.ref(
            "inviteCodes/" +
            inviteCode
        ).set(ref.key);


        alert(
            "作成しました。\n\n招待コード:\n" +
            inviteCode
        );


        window.location.href =
            "thread.html?id=" +
            encodeURIComponent(ref.key);


    } catch (error) {

        console.error(error);

        alert(
            "作成失敗:\n" +
            error.message
        );

    }

}


/* =================================
   招待コード
================================= */

async function joinByCode() {

    if (!currentUser) {

        alert("ログインしてください");

        return;
    }


    const code =
        document.getElementById(
            "inviteInput"
        ).value.trim();


    if (!code) {

        alert("招待コードを入力してください");

        return;
    }


    try {

        const snapshot =
            await db.ref(
                "inviteCodes/" +
                code
            ).once("value");


        if (!snapshot.exists()) {

            alert("無効な招待コードです");

            return;
        }


        const threadId =
            snapshot.val();


        await db.ref(
            "threads/" +
            threadId +
            "/members/" +
            currentUser.uid
        ).set(true);


        alert("参加しました");


        window.location.href =
            "thread.html?id=" +
            encodeURIComponent(threadId);


    } catch (error) {

        console.error(error);

        alert(
            "参加失敗:\n" +
            error.message
        );

    }

}


/* =================================
   招待コード生成
================================= */

function generateInviteCode(length = 20) {

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

    let result = "";

    for (let i = 0; i < length; i++) {

        result += chars.charAt(
            Math.floor(
                Math.random() *
                chars.length
            )
        );

    }

    return result;

}

</script>

</body>
</html>
