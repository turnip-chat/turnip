<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turnip - ログイン</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #f2f4f7;

    font-family:
        Arial,
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
}

.container {
    width: 380px;
    max-width: 90%;

    padding: 35px;

    background: white;

    border-radius: 15px;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.12);

    text-align: center;
}

h2 {
    margin-top: 0;
    margin-bottom: 25px;
}

button {
    border: none;

    border-radius: 8px;

    padding: 12px 20px;

    cursor: pointer;

    font-size: 15px;
}

button:hover {
    opacity: 0.9;
}

#googleButton {

    width: 100%;

    background: #4285f4;

    color: white;
}

#nameBox {

    display: none;

    margin-top: 25px;
}

#nameInput {

    width: 100%;

    padding: 11px;

    border:
        1px solid #ccc;

    border-radius: 7px;

    font-size: 15px;

    margin-bottom: 10px;
}

#saveButton {

    width: 100%;

    background: #222;

    color: white;
}

#status {

    margin-top: 20px;

    color: #666;

    min-height: 20px;
}

</style>
</head>

<body>


<div class="container">

    <h2>Turnip</h2>


    <!-- Googleログイン -->

    <button
        id="googleButton"
        onclick="googleLogin()"
    >
        Googleでログイン
    </button>


    <!-- 名前設定 -->

    <div id="nameBox">

        <h3>
            表示名を設定
        </h3>


        <input
            id="nameInput"
            type="text"
            maxlength="30"
            placeholder="表示名を入力"
        >


        <button
            id="saveButton"
            onclick="saveName()"
        >
            決定
        </button>

    </div>


    <p id="status">
        認証確認中...
    </p>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


<script>

/* =========================================
   Turnip Firebase
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDHLzaNUhtOt4Dztz7bTNclO_FY_Mbwb3g",

    authDomain:
        "turnip-1abf0.firebaseapp.com",

    databaseURL:
        "https://turnip-1abf0-default-rtdb.firebaseio.com",

    projectId:
        "turnip-1abf0"

};


firebase.initializeApp(
    firebaseConfig
);


const auth =
    firebase.auth();

const db =
    firebase.database();


let currentUser =
    null;


/* =========================================
   認証状態
========================================= */

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
)
.then(() => {

    auth.onAuthStateChanged(
        async function(user) {

            currentUser =
                user;


            const status =
                document.getElementById(
                    "status"
                );


            const nameBox =
                document.getElementById(
                    "nameBox"
                );


            const googleButton =
                document.getElementById(
                    "googleButton"
                );


            /* -------------------------
               未ログイン
            ------------------------- */

            if (!user) {

                googleButton.style.display =
                    "block";


                nameBox.style.display =
                    "none";


                status.innerText =
                    "未ログイン";


                return;
            }


            /* -------------------------
               ログイン済み
            ------------------------- */

            googleButton.style.display =
                "none";


            try {

                const snapshot =
                    await db.ref(
                        "users/" +
                        user.uid +
                        "/displayName"
                    ).once("value");


                const name =
                    snapshot.val();


                /* -------------------------
                   名前あり
                ------------------------- */

                if (name) {

                    localStorage.setItem(
                        "displayName",
                        name
                    );


                    status.innerText =
                        "ログイン済み";


                    /*
                     * スレッド一覧へ
                     */

                    window.location.replace(
                        "threads.html"
                    );


                    return;
                }


                /* -------------------------
                   名前なし
                ------------------------- */

                nameBox.style.display =
                    "block";


                status.innerText =
                    "表示名を設定してください";

            }

            catch(error) {

                console.error(error);


                status.innerText =
                    "エラー: " +
                    error.message;

            }

        }
    );

})
.catch(error => {

    console.error(error);


    document.getElementById(
        "status"
    ).innerText =
        "Firebase認証エラー: " +
        error.message;

});


/* =========================================
   Googleログイン
========================================= */

function googleLogin() {

    const provider =
        new firebase.auth.GoogleAuthProvider();


    provider.setCustomParameters({

        prompt:
            "select_account"

    });


    document.getElementById(
        "status"
    ).innerText =
        "Googleログイン中...";


    auth.signInWithPopup(
        provider
    )
    .then(result => {

        console.log(
            "Google login success:",
            result.user.uid
        );

    })
    .catch(error => {

        console.error(error);


        document.getElementById(
            "status"
        ).innerText =
            "ログイン失敗";


        alert(
            error.message
        );

    });

}


/* =========================================
   初回の名前保存
========================================= */

function saveName() {

    if (!currentUser) {

        alert(
            "ログインしてください"
        );

        return;
    }


    const input =
        document.getElementById(
            "nameInput"
        );


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "名前を入力してください"
        );

        return;
    }


    if (name.length > 30) {

        alert(
            "名前は30文字以内にしてください"
        );

        return;
    }


    db.ref(
        "users/" +
        currentUser.uid
    )
    .update({

        displayName:
            name

    })
    .then(() => {


        /* localStorage */

        localStorage.setItem(
            "displayName",
            name
        );


        /* スレッド一覧へ */

        window.location.replace(
            "threads.html"
        );

    })
    .catch(error => {

        console.error(error);


        alert(
            "名前の保存に失敗しました:\n" +
            error.message
        );

    });

}

</script>

</body>
</html>
```
